# hypr-shell equalizer: a 10-band EQ with a preamp, run by filter-chain.service.
# A WirePlumber smart filter: it sits in front of whatever output is the default, so volume keys and device
# switching keep working. The shell sets the gains at runtime (services/Equalizer.qml); all zero is transparent.
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Equalizer"
            media.name = "Equalizer"
            filter.graph = {
                nodes = [
            { type = builtin name = pre label = bq_highshelf control = { "Freq" = 0.0 "Q" = 1.0 "Gain" = 0.0 } }
            { type = builtin name = b1 label = bq_lowshelf control = { "Freq" = 32.0 "Q" = 0.7 "Gain" = 0.0 } }
            { type = builtin name = b2 label = bq_peaking control = { "Freq" = 64.0 "Q" = 1.41 "Gain" = 0.0 } }
            { type = builtin name = b3 label = bq_peaking control = { "Freq" = 125.0 "Q" = 1.41 "Gain" = 0.0 } }
            { type = builtin name = b4 label = bq_peaking control = { "Freq" = 250.0 "Q" = 1.41 "Gain" = 0.0 } }
            { type = builtin name = b5 label = bq_peaking control = { "Freq" = 500.0 "Q" = 1.41 "Gain" = 0.0 } }
            { type = builtin name = b6 label = bq_peaking control = { "Freq" = 1000.0 "Q" = 1.41 "Gain" = 0.0 } }
            { type = builtin name = b7 label = bq_peaking control = { "Freq" = 2000.0 "Q" = 1.41 "Gain" = 0.0 } }
            { type = builtin name = b8 label = bq_peaking control = { "Freq" = 4000.0 "Q" = 1.41 "Gain" = 0.0 } }
            { type = builtin name = b9 label = bq_peaking control = { "Freq" = 8000.0 "Q" = 1.41 "Gain" = 0.0 } }
            { type = builtin name = b10 label = bq_highshelf control = { "Freq" = 16000.0 "Q" = 0.7 "Gain" = 0.0 } }
                ]
                links = [
            { output = "pre:Out" input = "b1:In" }
            { output = "b1:Out" input = "b2:In" }
            { output = "b2:Out" input = "b3:In" }
            { output = "b3:Out" input = "b4:In" }
            { output = "b4:Out" input = "b5:In" }
            { output = "b5:Out" input = "b6:In" }
            { output = "b6:Out" input = "b7:In" }
            { output = "b7:Out" input = "b8:In" }
            { output = "b8:Out" input = "b9:In" }
            { output = "b9:Out" input = "b10:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "hs_eq"
                media.class = Audio/Sink
                filter.smart = true
                filter.smart.name = "hs-eq"
            }
            playback.props = {
                node.name = "hs_eq.output"
                node.passive = true
            }
        }
    }
]
