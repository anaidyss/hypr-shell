# hypr-shell defaults for mpv. The on-screen controller colors come from the wallpaper:
# hs-apps writes script-opts/osc.conf next to this file.

# Hardware decoding on the iGPU (VA-API), the modern renderer.
hwdec=auto-safe
vo=gpu-next
profile=high-quality

# Keep the last frame instead of closing, remember where a file was left.
keep-open=yes
save-position-on-quit=yes
watch-later-options-remove=pause

# Window: no bigger than most of the screen, title is just the file name.
autofit-larger=80%x80%
title=${media-title}

# Text in the shell font.
osd-font='Rubik'
osd-font-size=30
osd-bar-h=2
osd-border-size=1
sub-font='Rubik'
sub-font-size=44
sub-border-size=2

screenshot-directory=~/Pictures/Screenshots
screenshot-template=mpv_%F_%P
