# Config for the panel mini terminal (hs-miniterm): the session kitty config plus remote control and Escape.
include kitty.conf
allow_remote_control socket-only
background_opacity 1.0
# The window is 3 px larger than the cutout of the branch (the frame hides its edges) and the cutout has rounded
# corners, so the text needs room on every side to stay clear of both.
window_padding_width 10 14
confirm_os_window_close 0
# Lets fish_greeting print its compact one-line variant in the mini terminal.
env HS_MINITERM=1
# Escape closes the terminal when idle and only minimizes it while a process runs (see hs-miniterm esc).
map escape launch --type=background sh -c 'exec "$HOME/.local/bin/hs-miniterm" esc'
