# Idle chain: dim, lock, screen off, suspend. Started from the Hyprland autostart.
# Anything that inhibits idle (a video player, Steam, org.freedesktop.ScreenSaver) pauses the whole chain.
# Dim, screen-off and suspend are gated on `hs-lid` so nothing powers down while the lid is shut.

general {
    lock_cmd = hs-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    inhibit_sleep = 3
}

listener {
    timeout = 120
    on-timeout = hs-lid && brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360
    on-timeout = hs-lid && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 900
    on-timeout = hs-lid && systemctl suspend
}
