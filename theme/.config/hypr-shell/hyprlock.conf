# Fallback lock screen: used only when the Quickshell lock screen is unavailable (see bin/hs-lock).
# Same card as the shell's lock screen; colors and wallpaper come from hs-apps.
source = ~/.local/state/hypr-shell/apps/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = out, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 3, out
    animation = inputFieldColors, 1, 3, out
    animation = inputFieldDots, 1, 3, out
}

background {
    monitor =
    path = $wall
    color = rgb(000000)
    blur_passes = 3
    blur_size = 8
    noise = 0.03
    brightness = 0.45
}

shape {
    monitor =
    size = 372, 400
    color = $card
    rounding = 18
    border_size = 1
    border_color = $line
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 76
    font_family = $font Black
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%A, %-d %B"
    color = $textDim
    font_size = 15
    font_family = $font
    position = 0, 82
    halign = center
    valign = center
}

image {
    monitor =
    path = $avatar
    size = 72
    rounding = -1
    border_size = 0
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $text
    font_size = 16
    font_family = $font Bold
    position = 0, -30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 316, 46
    rounding = -1
    outline_thickness = 1
    outer_color = $line
    inner_color = $field
    font_color = $text
    font_family = $font
    check_color = $accent
    fail_color = $danger
    capslock_color = $danger
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff66">Password</span>
    fail_text = <span foreground="##ff6b6b">$FAIL</span>
    position = 0, -92
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[EN,RU]
    color = $textDim
    font_size = 13
    font_family = $font Bold
    position = 0, -140
    halign = center
    valign = center
}
